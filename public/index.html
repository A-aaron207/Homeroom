<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeroom</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAB0klEQVR4nO1bMU4DMRBcEFWEoOclfCcCQcdj6EAgvpOX0IMiWqgcLJ/PvrV3b+zzThUlsj0znl0nJ4fIYDCMjLOawXcPX79SRGrx/npdpIU9qCXRc+CYcc6ZuAfxRDyei5zqRXgMuTRkE9CzeKI8/6QBvYt3SOlg9QANPN/eQNefrQ/t3Y8Jfzp8ai4Z7QdRA7TEc3Zby4zQhAuVVQKUxNyN0U6FqgES9a1txKQEJOKv2dgkjPDLQCwBa3Vzfx0JM6oNQB5jEuVRbYBbHGFEEwlw8Mm03gN8qJwCGqnQOgVUj8Hd/khERD8fl9Vz0OFbgtIEar8F3l6uTq93++O/kIUIx/jzSUI8ASmivqBYKnImubnvH+XSIJoAzi75O8xNiGQaxAwoJcUtjdr1QogYoFWfa6xb1QNQwmMcSvtCcQJaEO+jlE9xAkLHEYZInAbwZ4JomAFoAmiYAWgCaAxvwCqPxX0sObrWPFKHT4AZgCaAhhmAJoCGGYAmgIYZgCaAhhmAJoDG8Aao3BBpHf4NkUkCSm9d94JQ3/AlYAbE3txqGcR0zSZgaybM6bESSH24lRSkdGQT0LsJOf4scT19SVq6cawe0EsaODyH/9+gwTA4/gBEDKCkJsiH8AAAAABJRU5ErkJggg==">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="dark">
    <!-- App Container -->
    <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="logo" style="display: flex; align-items: center; gap: 0.6rem;">
                    <img src="/favicon.svg" width="26" height="26" style="border-radius: 6px;" alt="Homeroom">
                    <span>Homeroom</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="nav-section-title">── Main ──</span>
                    <a href="#home" class="nav-item" data-page="home">🏠 Home</a>
                    <a href="#notes" class="nav-item" data-page="notes">📚 Notes</a>
                    <a href="#chats" class="nav-item" data-page="chats">💬 Chats</a>
                    <a href="#qna" class="nav-item" data-page="qna">❓ Q&A</a>
                    <a href="#community" class="nav-item" data-page="community">👥 Community</a>
                </div>
                
                <div class="nav-section">
                    <span class="nav-section-title">── Activity ──</span>
                    <a href="#tasks" class="nav-item" data-page="tasks">📋 Tasks</a>
                    <a href="#leaderboard" class="nav-item" data-page="leaderboard">🏆 Leaderboard</a>
                </div>
                
                <div class="nav-section">
                    <span class="nav-section-title">── Economy ──</span>
                    <a href="#marketplace" class="nav-item" data-page="marketplace">🛒 Marketplace</a>
                    <a href="#wallet" class="nav-item" data-page="wallet">💰 Wallet</a>
                </div>
                
                <div class="nav-section">
                    <span class="nav-section-title">── Personal ──</span>
                    <a href="#profile" class="nav-item" data-page="profile">👤 Profile</a>
                    <a href="#settings" class="nav-item" data-page="settings">⚙️ Settings</a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-mini-profile" id="sidebar-user">
                    <!-- Injected by app.js -->
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <div class="main-wrapper">
            <!-- Header -->
            <header class="app-header glass-panel">
                <button class="menu-toggle" id="menu-toggle">☰</button>
                <div class="header-search">
                    <input type="text" placeholder="Search..." id="global-search">
                </div>
                <div class="header-actions">
                    <div class="quick-action-wrapper" style="position: relative;">
                        <button id="btn-quick-create" class="btn btn-premium" style="padding: 0.35rem 0.75rem; border-radius: 2rem; font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 0.3rem; cursor: pointer; border: none;">
                            ➕ <span>Create</span>
                        </button>
                        <div id="quick-action-menu" style="display: none; position: absolute; top: 120%; right: 0; background: rgba(18, 18, 43, 0.98); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0.75rem; padding: 0.4rem; min-width: 160px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; flex-direction: column; gap: 0.25rem;">
                            <button onclick="document.getElementById('quick-action-menu').style.display='none'; location.hash='#qna'; setTimeout(()=>document.getElementById('btn-ask-q')?.click(), 300);" style="background: none; border: none; color: white; padding: 0.5rem 0.75rem; border-radius: 0.5rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; transition: background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.2)'" onmouseout="this.style.background='none'">
                                <span>❓</span> Ask Question
                            </button>
                            <button onclick="document.getElementById('quick-action-menu').style.display='none'; location.hash='#notes'; setTimeout(()=>document.getElementById('btn-upload-note')?.click(), 300);" style="background: none; border: none; color: white; padding: 0.5rem 0.75rem; border-radius: 0.5rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; transition: background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.2)'" onmouseout="this.style.background='none'">
                                <span>📄</span> Upload Note
                            </button>
                            <button onclick="document.getElementById('quick-action-menu').style.display='none'; location.hash='#chats'; setTimeout(()=>document.getElementById('btn-new-chat')?.click(), 300);" style="background: none; border: none; color: white; padding: 0.5rem 0.75rem; border-radius: 0.5rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; transition: background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.2)'" onmouseout="this.style.background='none'">
                                <span>💬</span> New Chat
                            </button>
                        </div>
                    </div>
                    <div class="coin-display" id="header-coins">⭐ 0 CC</div>
                    <button class="notification-bell" id="btn-notifications" style="position: relative; cursor: pointer;">🔔<span id="notif-badge" style="display: none; position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; border-radius: 10px; font-size: 0.65rem; padding: 1px 5px; font-weight: bold; min-width: 16px; text-align: center;">0</span></button>
                    <div class="header-avatar" id="header-avatar"></div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main id="main-content" class="content-area">
                <!-- Page injected here -->
            </main>
        </div>
        
        <!-- Mobile Bottom Nav -->
        <nav class="mobile-nav glass-panel">
            <a href="#home" class="mobile-nav-item" data-page="home">🏠</a>
            <a href="#notes" class="mobile-nav-item" data-page="notes">📚</a>
            <a href="#chats" class="mobile-nav-item" data-page="chats">💬</a>
            <a href="#tasks" class="mobile-nav-item" data-page="tasks">📋</a>
            <a href="#profile" class="mobile-nav-item" data-page="profile">👤</a>
            <button class="mobile-nav-item" id="mobile-menu-more">☰</button>
        </nav>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-backdrop" class="modal-backdrop" style="display: none;">
        <div class="modal glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">Modal Title</h3>
                <button class="modal-close" id="modal-close">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/offline_db.js?v=5"></script>
    <script src="js/store.js?v=5"></script>
    <script>window.Homeroom = window.Homeroom || {}; window.Homeroom.pages = {};</script>
    <script src="js/pages/home.js?v=5"></script>
    <script src="js/pages/notes.js?v=5"></script>
    <script src="js/pages/chats.js?v=5"></script>
    <script src="js/pages/qna.js?v=5"></script>
    <script src="js/pages/community.js?v=5"></script>
    <script src="js/pages/tasks.js?v=5"></script>
    <script src="js/pages/leaderboard.js?v=5"></script>
    <script src="js/pages/marketplace.js?v=5"></script>
    <script src="js/pages/wallet.js?v=5"></script>
    <script src="js/pages/profile.js?v=5"></script>
    <script src="js/pages/settings.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
