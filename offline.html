<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeroom - You're Offline</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #08081a;
            color: #f3f4f6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .offline-card {
            background: rgba(18, 18, 43, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 1.5rem;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
        }
        .offline-icon-wrapper {
            width: 84px;
            height: 84px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.12);
            border: 2px dashed rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 5px rgba(99, 102, 241, 0.2); }
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 0.75rem 0;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 2rem 0;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .btn-retry {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-bottom: 1rem;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        .btn-cached {
            width: 100%;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            color: #e5e7eb;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn-cached:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-wrapper">📶</div>
        <div class="status-pill">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block;"></span>
            No Internet Connection
        </div>
        <h1>You're Offline</h1>
        <p>Don't worry! Your cached notes, profile, timetable, and queued items are still available. Homeroom will sync automatically when your connection is restored.</p>
        <button class="btn-retry" onclick="checkConnection()">🔄 Retry Connection</button>
        <a href="index.html" class="btn-cached">📚 Open Cached Homeroom</a>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = 'index.html';
            } else {
                const btn = document.querySelector('.btn-retry');
                btn.textContent = '❌ Still Offline... Retrying';
                setTimeout(() => {
                    btn.textContent = '🔄 Retry Connection';
                }, 2000);
            }
        }

        window.addEventListener('online', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
