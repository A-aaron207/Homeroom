services:
  - type: web
    name: homeroom
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /data/homeroom.db
    disk:
      name: homeroom-data
      mountPath: /data
      sizeGB: 1
